name: Keep Upstash Redis Alive

on:
  schedule:
    # Runs at 00:00 UTC every 5 days
    - cron: "0 0 */5 * *"
  workflow_dispatch:

jobs:
  ping-redis:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Upstash Redis
        run: |
          response=$(curl -s -X GET "${{ secrets.UPSTASH_REDIS_REST_URL }}/ping" \
            -H "Authorization: Bearer ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}")
          echo "Response: $response"
          if [[ "$response" != *"PONG"* ]]; then
            echo "Failed to ping Upstash Redis"
            exit 1
          fi
